<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>5 分鐘健康示範 · Astro Hiyoko</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b141c;color:#e2eeef}
    body{max-width:760px;margin:4vh auto;padding:24px;line-height:1.7}a{color:#88d9e0}
    h1{font-size:30px;margin-bottom:8px}small{color:#9db2ba}section{background:#14242d;border:1px solid #30454c;border-radius:12px;padding:24px;margin:24px 0}
    button,input{font:inherit;padding:10px 16px;border-radius:7px}button{border:0;background:#f4c767;color:#15242a;cursor:pointer}button:disabled{opacity:.4;cursor:default}input{max-width:100%;box-sizing:border-box;border:1px solid #48616a;background:#0d1c25;color:inherit}
    #stop{background:#b6c8d0}progress{width:100%;height:18px}#status{font-weight:600}#error,#auth-error{color:#ffb5ac;white-space:pre-wrap}nav{display:flex;gap:20px;flex-wrap:wrap}form{display:flex;align-items:end;gap:12px;flex-wrap:wrap}form[hidden]{display:none}label{display:grid;gap:5px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #30454c}p{overflow-wrap:anywhere}
  </style>
</head>
<body>
  <small>ASTRO HIYOKO / 合成資料示範</small>
  <h1>30 天歷史＋5 分鐘健康示範</h1>
  <p>同一個後端時鐘同步船員活動、量測紀錄、手機與公共看板。五人皆為虛構角色，資料僅供功能展示。</p>
  <nav><a href="/" target="_blank" rel="noopener">開啟 3D 船艙</a><a href="/health/system" target="_blank" rel="noopener">開啟醫療監測站</a></nav>
  <section>
    <h2>示範控制</h2>
    <p id="dataset">正在讀取既有播放狀態…</p>
    <p>每次示範播放 5 分鐘，完成後停留在已儲存結果。重新整理、切換分頁或關閉控制頁皆不會建立新一輪。需要再次示範時，請由監測員按「開始新的示範」。</p>
    <p id="auth-status">正在確認監測員身分…</p>
    <form id="login" hidden>
      <label>監測員帳號<input name="username" value="monitor" autocomplete="username" required></label>
      <label>密碼<input name="password" type="password" autocomplete="current-password" required></label>
      <button id="sign-in">登入監測員</button>
    </form>
    <p id="auth-error" role="alert"></p>
    <button id="start" disabled>開始新的示範</button> <button id="stop" disabled>停止示範</button>
  </section>
  <section aria-live="polite">
    <p id="status">讀取中</p><progress id="progress" value="0" max="300000"></progress>
    <p id="counts">已提交進度 00:00 / 05:00</p><p id="timing"></p><p id="error" role="alert"></p>
    <table><thead><tr><th>船員</th><th>活動</th><th>接續活動</th></tr></thead><tbody id="activities"></tbody></table>
    <small>狀態與進度只取自醫療服務已提交的資料；斷線時保留最後一次進度。健康分數與警示由醫療系統依儲存紀錄計算。</small>
  </section>
  <script type="module" src="./health-demo-controls.mjs"></script>
</body>
</html>
